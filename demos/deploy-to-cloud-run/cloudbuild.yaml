steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/api-repo/my-api:$COMMIT_SHA'
      - '.'
    dir: 'demos/deploy-to-cloud-run'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/api-repo/my-api:$COMMIT_SHA'

  # Vulnerability gate: wait for the Artifact Registry scan, then block the
  # deploy if any finding matches the configured severity threshold.
  # The default `gcr.io/google.com/cloudsdktool/cloud-sdk:latest` image does
  # not ship with `jq`, so install it on demand.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends jq)

        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/api-repo/my-api:$COMMIT_SHA"
        FAIL_SEVERITIES="${_FAIL_SEVERITIES}"
        if [ -z "$$FAIL_SEVERITIES" ] || [ "$$FAIL_SEVERITIES" = "NONE" ]; then
          echo "Vulnerability gate DISABLED (_FAIL_SEVERITIES=$$FAIL_SEVERITIES). Skipping scan check."
          exit 0
        fi
        echo "Waiting for vulnerability scan to complete on $$IMAGE..."
        for i in $(seq 1 30); do
          RESULT=$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --format=json 2>/dev/null || echo '{}')
          if echo "$$RESULT" | jq -e '.package_vulnerability_summary' >/dev/null 2>&1; then
            break
          fi
          echo "Scan not ready yet, retrying in 10s ($$i/30)..."
          sleep 10
        done
        echo "Scan complete. Checking findings against threshold: $$FAIL_SEVERITIES"
        BLOCKING=$(echo "$$RESULT" | jq --arg sev "$$FAIL_SEVERITIES" '
          [.package_vulnerability_summary.vulnerabilities // {} | to_entries[]
           | select(.key as $$k | ($$sev | split(",")) | index($$k))
           | .value | length] | add // 0')
        echo "$$RESULT" | jq -r '.package_vulnerability_summary.vulnerabilities // {}
          | to_entries[] | "\(.key): \(.value | length)"'
        if [ "$$BLOCKING" -gt 0 ]; then
          echo "Vulnerability gate FAILED: $$BLOCKING finding(s) at severity in [$$FAIL_SEVERITIES]."
          exit 1
        fi
        echo "Vulnerability gate PASSED."

  # Deploy to Cloud Run as a canary: --no-traffic keeps the new revision off
  # the production split until the progressive-ramp step opens the tap, and
  # --tag=canary attaches a stable tagged URL (canary---<service>-...run.app)
  # so the smoke-test and bake checks can hit the new revision directly,
  # regardless of traffic percentage. On the very first deploy, the Terraform-
  # provisioned `cloudrun/container/hello` placeholder acts as the V0 stable.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-api-service'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/api-repo/my-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'
      - '--tag'
      - 'canary'
      - '--no-traffic'

  # Smoke test the new revision via its canary-tagged URL before any traffic
  # is shifted. If /health does not return 200 within the retry window, the
  # build fails and the traffic-split step never runs.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends jq)

        TAGGED_URL=$(gcloud run services describe my-api-service \
          --region=europe-west1 --format=json \
          | jq -r '.status.traffic[] | select(.tag=="canary") | .url')
        if [ -z "$$TAGGED_URL" ] || [ "$$TAGGED_URL" = "null" ]; then
          echo "Could not resolve the canary-tagged URL. Aborting."
          exit 1
        fi
        echo "Smoke-testing canary revision at $$TAGGED_URL/health"
        for i in $(seq 1 12); do
          HTTP_CODE=$(curl -s -o /tmp/smoke_body -w "%{http_code}" \
            "$$TAGGED_URL/health" || echo "000")
          if [ "$$HTTP_CODE" = "200" ]; then
            echo "Smoke test PASSED (HTTP $$HTTP_CODE)."
            cat /tmp/smoke_body; echo
            exit 0
          fi
          echo "Got HTTP $$HTTP_CODE, retrying in 5s ($$i/12)..."
          sleep 5
        done
        echo "Smoke test FAILED after 12 attempts. Not shifting traffic."
        exit 1

  # Progressive canary ramp: 10% -> 50% -> 100%, with an inline curl-based
  # health check during each bake window. If 5xx responses exceed the
  # tolerance, Cloud Build reverts traffic to the previous stable revision and
  # fails the build. Comment out this entire step for the very first (V1)
  # deploy alongside --no-traffic above.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends jq)

        SERVICE=my-api-service
        REGION=europe-west1
        BAKE_SECONDS=${_BAKE_SECONDS}
        MAX_5XX=${_MAX_5XX}
        SAMPLE_INTERVAL=5

        describe() {
          gcloud run services describe "$$SERVICE" --region="$$REGION" --format=json
        }

        LATEST=$(describe | jq -r '
          [.status.traffic[] | select(.tag=="canary") | .revisionName][0] // empty')
        STABLE=$(describe | jq -r '
          [.status.traffic[]
            | select(.tag != "canary")
            | select(.revisionName != null)
            | select(.percent > 0)]
          | sort_by(.percent) | reverse | .[0].revisionName // empty')

        if [ -z "$$LATEST" ]; then
          echo "No canary-tagged revision found. Did --tag=canary run on the deploy step?"
          exit 1
        fi
        if [ -z "$$STABLE" ]; then
          echo "No baseline revision in traffic. Deploy V1 at 100% before enabling the ramp."
          exit 1
        fi
        echo "Canary revision: $$LATEST"
        echo "Stable revision: $$STABLE"

        bake() {
          local stage="$$1"
          local url
          url=$(describe | jq -r '.status.traffic[] | select(.tag=="canary") | .url')
          local attempts=$(( BAKE_SECONDS / SAMPLE_INTERVAL ))
          local fails=0
          echo "[stage $$stage] baking $${BAKE_SECONDS}s, sampling $$url/ every $${SAMPLE_INTERVAL}s..."
          for i in $(seq 1 $$attempts); do
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" "$$url/" || echo "000")
            if [ "$$code" -ge "500" ]; then
              fails=$(( fails + 1 ))
              echo "[stage $$stage] sample $$i/$$attempts: HTTP $$code ($$fails 5xx so far)"
              if [ "$$fails" -gt "$$MAX_5XX" ]; then
                echo "[stage $$stage] FAILED: $$fails 5xx exceeds tolerance $$MAX_5XX."
                echo "Reverting traffic to $$STABLE and dropping canary tag..."
                gcloud run services update-traffic "$$SERVICE" --region="$$REGION" \
                  --to-revisions="$$STABLE=100" --remove-tags=canary
                exit 1
              fi
            fi
            sleep "$$SAMPLE_INTERVAL"
          done
          echo "[stage $$stage] passed ($$fails 5xx, within tolerance $$MAX_5XX)."
        }

        echo "===== Stage 1: 10% canary ====="
        gcloud run services update-traffic "$$SERVICE" --region="$$REGION" \
          --to-revisions="$$LATEST=10,$$STABLE=90" --update-tags="canary=$$LATEST"
        bake "10%"

        echo "===== Stage 2: 50% canary ====="
        gcloud run services update-traffic "$$SERVICE" --region="$$REGION" \
          --to-revisions="$$LATEST=50,$$STABLE=50" --update-tags="canary=$$LATEST"
        bake "50%"

        echo "===== Stage 3: 100% (graduate) ====="
        gcloud run services update-traffic "$$SERVICE" --region="$$REGION" \
          --to-revisions="$$LATEST=100" --remove-tags=canary
        echo "Canary fully promoted. $$LATEST is the new stable revision."

# Dedicated GCS bucket for build logs (provisioned by Terraform in
# infra/main.tf). Required when the trigger uses a user-managed service
# account — without it, Cloud Build refuses the run. Setting logs_bucket
# also keeps the inline log viewer in the Cloud Build UI working as normal.
logsBucket: 'gs://senserrich-test-293912-cloudbuild-logs'

substitutions:
  # Comma-separated severities that should fail the build (e.g. CRITICAL,HIGH).
  # Set to NONE to disable the gate entirely and always deploy.
  # Default for this demo is NONE because the Python slim base image carries
  # CRITICAL CVEs out of the box (a real teaching opportunity, but blocks
  # every build during the masterclass). Override per-run to demonstrate the
  # gate firing: --substitutions=_FAIL_SEVERITIES=CRITICAL
  _FAIL_SEVERITIES: 'NONE'
  # How long to bake at each canary stage before promoting to the next.
  _BAKE_SECONDS: '120'
  # Tolerance for 5xx responses observed during a bake window. Exceeding this
  # triggers an in-build revert to the previous stable revision.
  _MAX_5XX: '2'
